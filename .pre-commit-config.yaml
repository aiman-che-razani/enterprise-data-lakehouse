---
# RetailNexus Data Lakehouse — pre-commit hook configuration
#
# Install: pip install pre-commit && pre-commit install
# Run all manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate

minimum_pre_commit_version: "3.7.0"

repos:

  # ── Basic file hygiene ──────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]          # allow custom YAML tags (Airflow, Helm)
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]      # block files > 2 MB (binaries, model weights)
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  # ── Secret detection ────────────────────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --baseline
          - .secrets.baseline
        exclude: |
          (?x)(
              tests/|
              \.env\.example|
              docs/|
              notebooks/
          )

  # ── Python formatting ───────────────────────────────────────────────────────
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.12
        args: [--line-length=100]

  # ── Import sorting ──────────────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]

  # ── Linting (ruff — faster replacement for flake8 + bugbear + more) ─────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        # ruff-format is ruff's own formatter; it runs AFTER black for a
        # second pass on ruff-specific style rules. In practice they agree.

  # ── Static type checking ────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        # Only type-check source packages; skip generated/migration files
        files: ^(src|api)/
        args:
          - --ignore-missing-imports
          - --python-version=3.12
        additional_dependencies:
          - pydantic>=2.7.0
          - pydantic-settings>=2.3.0
          - structlog>=24.2.0
          - boto3-stubs[s3,secretsmanager]>=1.34.0
          - types-psycopg2>=2.9.21

  # ── SQL formatting (optional — comment out if sqlfluff is too slow) ─────────
  # - repo: https://github.com/sqlfluff/sqlfluff
  #   rev: 3.1.0
  #   hooks:
  #     - id: sqlfluff-lint
  #       args: [--dialect=ansi]
  #     - id: sqlfluff-fix
  #       args: [--dialect=ansi]

  # ── Markdown ────────────────────────────────────────────────────────────────
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: [--disable, MD013, MD033, MD041]
        # MD013 = line length (we use tables), MD033 = inline HTML, MD041 = first heading

  # ── Shell scripts ───────────────────────────────────────────────────────────
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: \.sh$

  # ── Docker ──────────────────────────────────────────────────────────────────
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: [--ignore, DL3008, --ignore, DL3009]
        # DL3008 = pin apt versions; acceptable risk for dev images

  # ── Terraform ───────────────────────────────────────────────────────────────
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.92.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        files: ^terraform/

  # ── Jupyter notebooks ───────────────────────────────────────────────────────
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.8.5
    hooks:
      - id: nbqa-black
        args: [--line-length=100]
      - id: nbqa-ruff
        args: [--fix]

ci:
  autofix_prs: true
  autofix_commit_msg: "style: auto-fix pre-commit hooks [skip ci]"
  autoupdate_schedule: monthly
  autoupdate_commit_msg: "chore: bump pre-commit hook versions [skip ci]"
