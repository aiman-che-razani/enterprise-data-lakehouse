[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ─── Project metadata ──────────────────────────────────────────────────────────
[project]
name = "retailnexus-lakehouse"
version = "1.0.0"
description = "Enterprise-grade medallion-architecture data lakehouse for RetailNexus"
authors = [{ name = "Platform Engineering", email = "platform@retailnexus.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
keywords = ["data-lakehouse", "spark", "delta-lake", "airflow", "kafka"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# Core runtime dependencies (kept minimal — Spark/Airflow deps installed in containers)
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "structlog>=24.2.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "prometheus-client>=0.20.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
    "psycopg2-binary>=2.9.9",
    "click>=8.1.7",
    "rich>=13.7.0",
]

[project.optional-dependencies]
# PySpark + Delta Lake
spark = [
    "pyspark==3.5.3",
    "delta-spark==3.2.0",
    "pyarrow>=16.0.0",
    "pandas>=2.2.0",
]

# Kafka
kafka = [
    "confluent-kafka>=2.4.0",
    "fastavro>=1.9.4",
]

# API service
api = [
    "fastapi>=0.135.0,<1.0.0",
    # Starlette < 1.3.1 has published vulnerabilities (pip-audit); FastAPI allows the newer line.
    "starlette>=1.3.1",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "slowapi>=0.1.9",
]

# Airflow — installed in container, listed here for local dev reference
airflow = [
    "apache-airflow==2.9.3",
    "apache-airflow-providers-amazon>=8.24.0",
    "apache-airflow-providers-apache-spark>=4.9.0",
    "apache-airflow-providers-postgres>=5.11.0",
    "apache-airflow-providers-apache-kafka>=1.3.1",
]

# Data generation
datagen = [
    "faker>=25.8.0",
    "numpy>=1.26.0",
]

# Development & testing
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.5.0",
    "httpx>=0.27.0",
    "httpx2>=2.0.0",   # Starlette 1.x TestClient uses httpx2
    "moto[s3,secretsmanager]>=5.0.10",
    "black>=24.4.2",
    "ruff>=0.4.7",
    "isort>=5.13.2",
    "mypy>=1.10.0",
    "types-boto3",
    "types-requests",
    "pre-commit>=3.7.0",
    "pyyaml>=6.0",
    "faker>=25.8.0",
    "numpy>=1.26.0",
]

# ─── Setuptools ────────────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "airflow*", "spark*", "api*"]

# ─── Black ────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.ruff_cache
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

# ─── isort ────────────────────────────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["src", "api", "spark", "airflow"]
known_third_party = ["pyspark", "delta", "airflow", "fastapi", "pydantic"]

# ─── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by Black)
    "B008",   # do not perform function calls in default arguments
    "B904",   # raise ... from err (too strict for now)
    "N818",   # exception names with Error suffix (too strict)
    "N812",   # `from pyspark.sql import functions as F` is the universal PySpark idiom
    "RUF001", # ambiguous unicode in strings/docstrings/comments: ×, σ, em dashes are intentional
    "RUF002",
    "RUF003",
]
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "notebooks/",
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves field annotations at runtime, so imports they use must not move under TYPE_CHECKING.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "N802", "N806", "E741", "E402", "B017", "RUF012"]  # assert, class-style locals, `l` loop names and shared class fixtures are fine in tests
"datasets/generators/**/*.py" = ["N802", "N803"]

# ─── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true
show_error_codes = true
show_column_numbers = true
pretty = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true   # src/ and api/ both contain modules with the same basenames
mypy_path = "."
exclude = [
    "build/",
    "dist/",
    "notebooks/",
    ".venv/",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "pyspark.*",
    "delta.*",
    "airflow.*",
    "confluent_kafka.*",
    "fastavro.*",
    "moto.*",
    "prometheus_client.*",
    "structlog.*",
    "boto3.*",
    "botocore.*",
]
ignore_missing_imports = true

# ─── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-ra",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: fast unit tests with no external dependencies",
    "integration: integration tests requiring live services",
    "pipeline: end-to-end pipeline tests",
    "spark: tests that require a Spark session",
    "airflow: tests that require Apache Airflow (skipped when it is not installed)",
    "slow: tests that take > 30 seconds",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pyspark",
    "ignore::DeprecationWarning:airflow",
    "ignore::PendingDeprecationWarning",
    # py4j leaves gateway sockets to the GC; pytest surfaces that as an unraisable ResourceWarning.
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

# ─── coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src", "api", "spark"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "datasets/generators/*",
]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]
