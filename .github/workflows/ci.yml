# ═══════════════════════════════════════════════════════════════════════════════
# RetailNexus Data Lakehouse — Continuous Integration
#
# Triggered: every pull_request to main, every push to main
# Jobs (run in parallel where possible):
#   1. lint     — ruff, isort, black check
#   2. typecheck — mypy
#   3. test     — pytest unit tests
#   4. build    — Docker image builds (verify Dockerfiles are valid)
# ═══════════════════════════════════════════════════════════════════════════════

name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".gitignore"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".gitignore"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Minimal env for tests — no live services required for unit tests
  ENVIRONMENT: dev
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_USER: lakehouse
  POSTGRES_PASSWORD: lakehouse
  POSTGRES_DB: lakehouse
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin
  KAFKA_BOOTSTRAP_SERVERS: localhost:9092
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1
  SECRETS_BACKEND: env

permissions:
  contents: read

jobs:
  # ─── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff · isort · black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: pip install ruff isort black

      - name: Generated artifacts are current (warehouse migrations, data dictionary)
        run: |
          python scripts/deployment/build_migrations.py --check
          python scripts/deployment/build_data_dictionary_gold.py --check
          python scripts/deployment/pin_actions.py --check   # every action pinned to a commit SHA

      - name: ruff check
        run: ruff check src/ tests/ api/ spark/ airflow/ datasets/generators/ --output-format=github

      - name: isort check
        run: isort --check-only --diff src/ tests/ api/ spark/ airflow/ datasets/generators/

      - name: black check
        run: black --check --diff src/ tests/ api/ spark/ airflow/ datasets/generators/

  # ─── Job 2: Type Check ────────────────────────────────────────────────────────
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies (mypy needs the real packages to check against)
        run: pip install -e ".[dev,api,spark]" "mypy==1.10.0" types-psycopg2 types-PyYAML

      - name: mypy (strict, per pyproject.toml)
        run: mypy src api

  # ─── Job 3: Unit Tests ────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Java 17 (PySpark 3.5 supports JDK 8/11/17)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -e ".[dev,api,spark]"

      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            -m unit \
            -v \
            --tb=short \
            --cov=src \
            --cov=api \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=test-results/unit.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: unit-test-results
          path: test-results/

  # ─── Job 3a: Pipeline tests (real Spark + Delta, local mode) ──────────────────
  # These run the Bronze/Silver/Gold/DQ code against real Delta tables. They were never in CI, and
  # most of them were broken (shared-schema mutation, a skipped-by-default fixture, a Delta jar that
  # was never on the classpath) until they ran. The Delta jars are fetched from Maven Central when the
  # JVM starts, so this job needs network access.
  test-pipeline:
    name: Pipeline tests (Spark + Delta)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Java 17 (PySpark 3.5 supports JDK 8/11/17)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -e ".[dev,api,spark]"

      - name: Run pipeline and Spark integration tests
        run: |
          pytest tests/pipeline/ tests/integration/spark/             -v             --tb=short             --junitxml=test-results/pipeline.xml

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: pipeline-test-results
          path: test-results/

  # ─── Job 3b: Airflow DAG + plugin tests ───────────────────────────────────────
  test-airflow:
    name: Airflow DAGs & plugins
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow-home
      AIRFLOW__CORE__UNIT_TEST_MODE: "True"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Airflow (pinned by the official constraints file)
        run: |
          pip install "apache-airflow==2.9.3" \
            "apache-airflow-providers-apache-spark>=4.9.0" "apache-airflow-providers-postgres>=5.11.0" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.3/constraints-${{ env.PYTHON_VERSION }}.txt"

      - name: Install project (same constraints - Airflow 2.9 needs SQLAlchemy 1.4, so no [api] extra here)
        run: |
          pip install -e ".[dev,spark]" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.9.3/constraints-${{ env.PYTHON_VERSION }}.txt"

      - name: Initialise the Airflow metadata DB
        run: airflow db migrate

      - name: Run Airflow tests
        run: pytest tests/unit/test_airflow_dags.py tests/unit/test_airflow_operators.py tests/integration/airflow -v --tb=short

  # ─── Job 3c: Terraform fmt + validate ─────────────────────────────────────────
  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, prod]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: "1.8.5"

      - name: terraform fmt
        run: terraform fmt -check -recursive terraform

      - name: terraform init (no backend) + validate
        working-directory: terraform/environments/${{ matrix.env }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  # ─── Job 3d: Monitoring config (promtool / amtool) ────────────────────────────
  monitoring:
    name: Prometheus rules & Alertmanager config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: promtool check config + rules
        run: |
          docker run --rm -v "$PWD/configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"             -v "$PWD/monitoring/prometheus/rules:/etc/prometheus/rules:ro"             --entrypoint promtool prom/prometheus:v2.52.0 check config /etc/prometheus/prometheus.yml

      - name: amtool check-config (dev routing)
        run: |
          docker run --rm -v "$PWD/monitoring/alerts:/a:ro"             --entrypoint amtool prom/alertmanager:v0.27.0 check-config /a/alertmanager.yml

  # ─── Job 4: Docker Build ──────────────────────────────────────────────────────
  docker-build:
    name: Docker Build (validate Dockerfiles)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: airflow
            context: .
            dockerfile: docker/airflow/Dockerfile
          - name: api
            context: .
            dockerfile: docker/api/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build ${{ matrix.service.name }} image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: false
          tags: retailnexus/${{ matrix.service.name }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 5: Security Scan ─────────────────────────────────────────────────────
  security:
    name: Security Scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit installed dependencies (fails the build on known vulnerabilities)
        # Known, reviewed exceptions go in .pip-audit-ignore (one vulnerability id per line).
        run: |
          IGNORES=""
          if [ -f .pip-audit-ignore ]; then
            for id in $(grep -v '^#' .pip-audit-ignore); do IGNORES="$IGNORES --ignore-vuln $id"; done
          fi
          pip-audit $IGNORES
