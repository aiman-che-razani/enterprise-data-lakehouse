# ═══════════════════════════════════════════════════════════════════════════════
# RetailNexus Data Lakehouse — CD: Staging Deployment
#
# Triggered: push to main (after CI passes)
# Steps:
#   1. Build and push Docker images to ECR
#   2. Deploy to staging ECS
#   3. Run smoke tests
#   4. Notify Slack
# ═══════════════════════════════════════════════════════════════════════════════

name: CD — Staging

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push Images to ECR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC -> AWS, no stored keys
    environment: staging
    outputs:
      image_tag: ${{ env.IMAGE_TAG }}
    strategy:
      matrix:
        service: [airflow, api]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: docker/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/retailnexus-${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/retailnexus-${{ matrix.service }}:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging ECS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC -> AWS, no stored keys
    needs: build-and-push
    environment:
      name: staging
      url: https://staging.lakehouse.retailnexus.internal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy FastAPI to ECS
        run: |
          aws ecs update-service \
            --cluster retailnexus-staging \
            --service lakehouse-api \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster retailnexus-staging \
            --services lakehouse-api \
            --region ${{ env.AWS_REGION }}

  smoke-test:
    name: Smoke Tests (Staging)
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: API smoke test (readiness, auth, pipeline/quality/catalog, metrics)
        run: |
          bash scripts/deployment/smoke_test.sh \
            https://staging-api.lakehouse.retailnexus.internal \
            "${{ secrets.STAGING_API_KEY }}"

  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: always()
    steps:
      - name: Notify success
        if: needs.smoke-test.result == 'success'
        uses: slackapi/slack-github-action@fcfb566f8b0aab22203f066d80ca1d7e4b5d05b3  # v1
        with:
          payload: |
            {
              "text": "✅ *Staging deployed successfully*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *RetailNexus Lakehouse — Staging Deploy*\nCommit: `${{ github.sha }}`\nAuthor: ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify failure
        if: needs.smoke-test.result != 'success'
        uses: slackapi/slack-github-action@fcfb566f8b0aab22203f066d80ca1d7e4b5d05b3  # v1
        with:
          payload: |
            {
              "text": "❌ *Staging deploy FAILED* — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
