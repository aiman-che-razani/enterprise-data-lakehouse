# ═══════════════════════════════════════════════════════════════════════════════
# RetailNexus Data Lakehouse — Docker Compose Stack
# Services: Spark, Kafka, Airflow, PostgreSQL, MinIO, FastAPI,
#           Prometheus, Grafana, Elasticsearch, Logstash, Kibana
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Shared Airflow block ─────────────────────────────────────────────────────
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: retailnexus/airflow:2.9.3
  environment: &airflow-common-env
    # Core
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-Kx3-REPLACE-ME-CHANGE-IN-DOT-ENV}
    # Database
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@postgres:5432/${AIRFLOW_POSTGRES_DB:-airflow}
    # Webserver
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-dev-secret-change-me}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__WEBSERVER__RBAC: "true"
    # Metrics: StatsD -> statsd-exporter -> Prometheus job "airflow"
    AIRFLOW__METRICS__STATSD_ON: "true"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: "9125"
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    # Logging
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
    # API
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    # Passthrough — S3 / MinIO
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    S3_ENDPOINT_URL: http://minio:9000
    LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-retailnexus-lakehouse}
    # App env
    ENVIRONMENT: ${ENVIRONMENT:-dev}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER:-lakehouse}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lakehouse}
    POSTGRES_DB: ${POSTGRES_DB:-lakehouse}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/include:/opt/airflow/include
    - airflow_logs:/opt/airflow/logs
    - ./src:/opt/airflow/src:ro
    - ./spark:/opt/airflow/spark:ro
    - ./configs:/opt/airflow/configs:ro
    - ./datasets:/opt/airflow/datasets:ro
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - lakehouse-net
  restart: on-failure

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  lakehouse-net:
    driver: bridge
    name: lakehouse-net

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  minio_bitnami_data:
  airflow_logs:
  spark_logs:
  grafana_data:
  prometheus_data:
  alertmanager_data:
  elasticsearch_data:

# ═══════════════════════════════════════════════════════════════════════════════
# SERVICES
# ═══════════════════════════════════════════════════════════════════════════════
services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16.3-alpine
    container_name: lakehouse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lakehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lakehouse}
      POSTGRES_DB: ${POSTGRES_DB:-lakehouse}
      POSTGRES_MULTIPLE_DATABASES: "lakehouse,airflow"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/setup/init_postgres.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      # Dev-only seed data (well-known API key). Never mount this in staging/prod.
      - ./scripts/setup/seed_dev_data.sql:/docker-entrypoint-initdb.d/02_seed_dev.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lakehouse} -d ${POSTGRES_DB:-lakehouse}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ─── Apache Zookeeper ────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: lakehouse-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "ruok,srvr,stat,mntr"
    ports:
      - "127.0.0.1:2181:2181"
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/commands/ruok | grep -q '\"ruok\"'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ─── Apache Kafka ─────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: lakehouse-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:29092:29092"
    networks:
      - lakehouse-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:29092 --list > /dev/null 2>&1",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ─── Kafka UI (Bonus: makes Kafka dev much easier) ────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: lakehouse-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: lakehouse-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "127.0.0.1:8090:8080"
    networks:
      - lakehouse-net
    restart: unless-stopped

  # ─── Spark Master ─────────────────────────────────────────────────────────────
  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: retailnexus/spark:3.5.3
    container_name: lakehouse-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --webui-port 18080
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
      SPARK_MASTER_WEBUI_PORT: 18080
      # S3 / MinIO access
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ./configs/spark/spark-defaults.dev.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./configs/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
      - spark_logs:/opt/spark/logs
      - ./src:/opt/spark/src:ro
      - ./spark:/opt/spark/spark:ro
    ports:
      - "127.0.0.1:18080:18080"   # Spark Master Web UI
      - "127.0.0.1:7077:7077"     # Spark Master RPC
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:18080 > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ─── Spark Worker ─────────────────────────────────────────────────────────────
  spark-worker:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: retailnexus/spark:3.5.3
    container_name: lakehouse-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --cores ${SPARK_WORKER_CORES:-2} --memory ${SPARK_WORKER_MEMORY:-4g} spark://spark-master:7077
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-4g}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ./configs/spark/spark-defaults.dev.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./configs/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro
      - spark_logs:/opt/spark/logs
      - ./src:/opt/spark/src:ro
      - ./spark:/opt/spark/spark:ro
    networks:
      - lakehouse-net
    restart: unless-stopped

  # ─── MinIO (S3-Compatible Object Store) ───────────────────────────────────────
  minio:
    # MinIO no longer publishes images to Docker Hub or Quay (minio/minio pulls fail). The Bitnami legacy
    # mirror still serves the same 2024-06-13 release. It is frozen: no security updates, so it is a
    # local-development image only - production uses real S3 (terraform/modules/s3).
    image: bitnamilegacy/minio:2024.6.13
    container_name: lakehouse-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ${LAKEHOUSE_BUCKET:-retailnexus-lakehouse}
      MINIO_PROMETHEUS_AUTH_TYPE: public   # lets the Prometheus "minio" job scrape without a token
    volumes:
      - minio_bitnami_data:/bitnami/minio/data
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # Web Console
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ─── MinIO Init (creates buckets on first run) ────────────────────────────────
  minio-init:
    image: bitnamilegacy/minio-client:latest
    container_name: lakehouse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./scripts/setup/init_minio.sh:/init_minio.sh:ro
    entrypoint: ["/bin/bash", "/init_minio.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-retailnexus-lakehouse}
    networks:
      - lakehouse-net
    restart: no

  # ─── Airflow — One-Time Init ──────────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: lakehouse-airflow-init
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create           --username "${AIRFLOW_ADMIN_USER:-admin}"           --password "${AIRFLOW_ADMIN_PASSWORD:-admin}"           --firstname "${AIRFLOW_ADMIN_FIRSTNAME:-Admin}"           --lastname "${AIRFLOW_ADMIN_LASTNAME:-User}"           --role Admin           --email "${AIRFLOW_ADMIN_EMAIL:-admin@retailnexus.com}" &&
        echo 'Airflow init complete.'
    restart: "no"

  # ─── Airflow — Web Server ─────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: lakehouse-airflow-webserver
    command: airflow webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health | grep healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ─── Airflow — Scheduler ──────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: lakehouse-airflow-scheduler
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ─── FastAPI ──────────────────────────────────────────────────────────────────
  fastapi:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: retailnexus/api:latest
    container_name: lakehouse-fastapi
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      API_SECRET_KEY: ${API_SECRET_KEY:-dev-secret-change-me}
      API_DEBUG: ${API_DEBUG:-true}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-300}  # per API key; 0 disables
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-lakehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lakehouse}
      POSTGRES_DB: ${POSTGRES_DB:-lakehouse}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      S3_ENDPOINT_URL: http://minio:9000
      LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-retailnexus-lakehouse}
    volumes:
      - ./api:/app/api:ro
      - ./src:/app/src:ro
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ─── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: lakehouse-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ─── Metrics exporters (scraped by Prometheus; see configs/prometheus/prometheus.yml) ───
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: lakehouse-kafka-exporter
    command: ["--kafka.server=kafka:29092"]
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - lakehouse-net
    restart: unless-stopped

  statsd-exporter:
    image: prom/statsd-exporter:v0.26.1
    container_name: lakehouse-statsd-exporter
    networks:
      - lakehouse-net
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: lakehouse-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - lakehouse-net
    restart: unless-stopped

  # ─── Alertmanager ─────────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: lakehouse-alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./monitoring/alerts/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ─── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    container_name: lakehouse-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health | grep ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ─── Elasticsearch ───────────────────────────────────────────────────────────
  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: lakehouse-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-elastic}
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9300:9300"
    networks:
      - lakehouse-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  # ─── Logstash ─────────────────────────────────────────────────────────────────
  logstash:
    image: logstash:8.13.4
    container_name: lakehouse-logstash
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    volumes:
      - ./monitoring/elk/logstash/pipeline.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./monitoring/elk/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    ports:
      - "127.0.0.1:5044:5044"   # Beats input
      - "127.0.0.1:5000:5000"   # TCP input (JSON logs)
      - "127.0.0.1:9600:9600"   # Logstash API
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9600/_node/stats | grep -q 'events'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  # ─── Kibana ───────────────────────────────────────────────────────────────────
  kibana:
    image: kibana:8.13.4
    container_name: lakehouse-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
      SERVER_NAME: lakehouse-kibana
    ports:
      - "127.0.0.1:5601:5601"
    networks:
      - lakehouse-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:5601/api/status | grep -q 'available'",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped
