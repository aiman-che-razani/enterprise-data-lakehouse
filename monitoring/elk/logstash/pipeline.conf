# ═══════════════════════════════════════════════════════════════════════════════
# Logstash Pipeline — RetailNexus Lakehouse
# Accepts structured JSON logs from all services via TCP input.
# Enriches with source metadata and routes to Elasticsearch.
# ═══════════════════════════════════════════════════════════════════════════════

input {
  # TCP input for JSON log lines (Docker logging driver → Logstash)
  tcp {
    port => 5000
    codec => json_lines {
      charset => "UTF-8"
    }
    tags => ["tcp-json"]
  }

  # Beats input (Filebeat from containers)
  beats {
    port => 5044
    tags => ["beats"]
  }
}

filter {
  # ─── Parse timestamp ────────────────────────────────────────────────────────
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSZ"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # ─── Set index from service name ────────────────────────────────────────────
  if ![service] {
    mutate {
      add_field => { "service" => "unknown" }
    }
  }

  # ─── Add environment metadata ───────────────────────────────────────────────
  mutate {
    add_field => {
      "environment" => "${ENVIRONMENT:dev}"
      "project"     => "retailnexus-lakehouse"
    }
  }

  # ─── Normalize log level ────────────────────────────────────────────────────
  if [level] {
    mutate {
      uppercase => ["level"]
    }
  }

  # ─── Tag pipeline logs by layer ─────────────────────────────────────────────
  if [layer] {
    mutate {
      add_tag => ["%{layer}"]
    }
  }

  # ─── Drop noisy health check logs ───────────────────────────────────────────
  if [message] =~ /GET \/health/ and [level] == "INFO" {
    drop {}
  }
}

output {
  # ─── Elasticsearch ──────────────────────────────────────────────────────────
  elasticsearch {
    hosts      => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
    index      => "lakehouse-%{service}-%{+YYYY.MM.dd}"
    action     => "index"
    retry_on_conflict => 3
    manage_template => false
  }

  # ─── Debug stdout (disable in prod) ─────────────────────────────────────────
  if [@metadata][debug] {
    stdout {
      codec => rubydebug
    }
  }
}
