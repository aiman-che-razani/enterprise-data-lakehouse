# ═══════════════════════════════════════════════════════════════════════════════
# Alertmanager — local development
# Alerts are grouped and visible in the Alertmanager UI (http://localhost:9093),
# but no notifications leave the machine. Production routing (Slack + PagerDuty)
# lives in alertmanager.prod.yml.
# ═══════════════════════════════════════════════════════════════════════════════

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default

# A critical alert silences the matching warning for the same alert name.
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname]
