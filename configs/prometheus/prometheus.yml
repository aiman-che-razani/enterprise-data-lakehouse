# ═══════════════════════════════════════════════════════════════════════════════
# Prometheus Scrape Configuration — RetailNexus Lakehouse
#
# Every job below scrapes a service that exists in docker-compose.yml and exposes the metric names the
# alert rules and Grafana dashboards use (tests/unit/test_monitoring_config.py checks both directions).
# ═══════════════════════════════════════════════════════════════════════════════

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    environment: dev
    project: retailnexus-lakehouse

# ─── Alert rules ──────────────────────────────────────────────────────────────
rule_files:
  - /etc/prometheus/rules/*.yml

# ─── Alertmanager ─────────────────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

# ─── Scrape configs ───────────────────────────────────────────────────────────
scrape_configs:

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # FastAPI — prometheus-fastapi-instrumentator + the retailnexus_* pipeline gauges
  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets: [fastapi:8000]

  # Spark master — PrometheusServlet sink (configs/spark/metrics.properties). The UI redirects
  # to the trailing-slash path, so the slash is part of the configured path.
  - job_name: spark-master
    metrics_path: /metrics/master/prometheus/
    static_configs:
      - targets: [spark-master:18080]

  # Airflow — StatsD -> statsd-exporter (Airflow has no native Prometheus endpoint)
  - job_name: airflow
    static_configs:
      - targets: [statsd-exporter:9102]

  # MinIO — native cluster metrics (MINIO_PROMETHEUS_AUTH_TYPE=public in compose)
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [minio:9000]

  # Kafka — consumer-group lag, topic offsets, broker count
  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]

  # Containers — CPU / memory / network per service (infrastructure dashboard)
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
