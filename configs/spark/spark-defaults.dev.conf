# ═══════════════════════════════════════════════════════════════════════════════
# LOCAL DEVELOPMENT ONLY — mounted by docker-compose, never copied into an image.
# = spark-defaults.conf + the MinIO endpoint / credentials below.
# tests/unit/test_secret_hygiene.py keeps the two files in sync.
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# RetailNexus Spark Defaults
# Applied to all Spark sessions running in the lakehouse stack.
# Override per-job via SparkConf or environment-specific configs.
# ═══════════════════════════════════════════════════════════════════════════════

# ─── Delta Lake ───────────────────────────────────────────────────────────────
spark.sql.extensions                        io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog             org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.databricks.delta.retentionDurationCheck.enabled  false

# ─── S3 (Hadoop AWS) ─────────────────────────────────────────────────────────
# Credentials come from the AWS default provider chain (task / instance role, env vars).
# NOTHING secret belongs in this file: it is baked into the Spark image that CD ships.
# Local MinIO endpoint and keys live in spark-defaults.dev.conf (docker-compose only).
spark.hadoop.fs.s3a.impl                   org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider  com.amazonaws.auth.DefaultAWSCredentialsProviderChain
spark.hadoop.fs.s3a.connection.maximum     100
spark.hadoop.fs.s3a.fast.upload            true
spark.hadoop.fs.s3a.fast.upload.buffer     disk
spark.hadoop.fs.s3a.multipart.size         128M
spark.hadoop.fs.s3a.committer.name         partitioned
spark.hadoop.mapreduce.outputcommitter.factory.scheme.s3a \
    org.apache.hadoop.fs.s3a.commit.S3ACommitterFactory

# ─── Performance ─────────────────────────────────────────────────────────────
spark.sql.adaptive.enabled                  true
spark.sql.adaptive.coalescePartitions.enabled  true
spark.sql.adaptive.skewJoin.enabled         true
spark.sql.adaptive.localShuffleReader.enabled  true
spark.sql.shuffle.partitions                200
spark.default.parallelism                   200

# Broadcast join threshold (256 MB — covers most dimension tables)
spark.sql.autoBroadcastJoinThreshold        268435456

# Dynamic partition overwrite (safe incremental writes)
spark.sql.sources.partitionOverwriteMode    dynamic

# ─── Serialization ───────────────────────────────────────────────────────────
spark.serializer                            org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max             512m

# ─── Memory ───────────────────────────────────────────────────────────────────
spark.executor.memoryFraction               0.8
spark.memory.offHeap.enabled                true
spark.memory.offHeap.size                   1g

# ─── Checkpointing (streaming) ────────────────────────────────────────────────
spark.streaming.stopGracefullyOnShutdown    true

# ─── Logging ──────────────────────────────────────────────────────────────────
spark.eventLog.enabled                      false
spark.ui.enabled                            true
spark.ui.port                               4040

# ─── SQL ──────────────────────────────────────────────────────────────────────
spark.sql.legacy.timeParserPolicy           LEGACY
spark.sql.parquet.datetimeRebaseModeInRead  CORRECTED
spark.sql.parquet.datetimeRebaseModeInWrite CORRECTED
spark.sql.parquet.int96RebaseModeInRead     CORRECTED
spark.sql.parquet.int96RebaseModeInWrite    CORRECTED

# ─── Python ───────────────────────────────────────────────────────────────────
spark.pyspark.python                        python3
spark.pyspark.driver.python                 python3

# ─── Local MinIO overrides ────────────────────────────────────────────────────
spark.hadoop.fs.s3a.endpoint                http://minio:9000
spark.hadoop.fs.s3a.access.key             minioadmin
spark.hadoop.fs.s3a.secret.key             minioadmin
spark.hadoop.fs.s3a.path.style.access      true
spark.hadoop.fs.s3a.aws.credentials.provider  org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
